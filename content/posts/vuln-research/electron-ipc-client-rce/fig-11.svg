<text x="288.0" y="460.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="500" fill="#475569" text-anchor="middle">攻击者控制网页，用户通过内置浏览器访问</text>
<rect x="560.0" y="180.0" width="480.0" height="420.0" rx="18" fill="#ffffff" stroke="#d97706" stroke-width="2.5"/>
<circle cx="600.0" cy="230.0" r="16" fill="#d97706"/>
<text x="600.0" y="236.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="820.0" y="236.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">本地执行</text>
<path d="M746 288 l28 -12 28 12 v26 c0 18 -16 30 -28 36 c-12 -6 -28 -18 -28 -36 z" fill="#d97706"/>
