<rect x="8" y="8" width="1584" height="884" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="800.0" y="64.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="34" font-weight="700" fill="#0f172a" text-anchor="middle">为什么这是客户端 RCE？</text>
<text x="800.0" y="100.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="500" fill="#0e7490" text-anchor="middle">攻击入口来自远程内容，代码执行发生在受害者本机</text>
