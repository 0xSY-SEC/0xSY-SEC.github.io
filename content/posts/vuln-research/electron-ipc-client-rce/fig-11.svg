<text x="1312.0" y="460.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="500" fill="#475569" text-anchor="middle">执行能力来自主进程 IPC，普通网页本身不具备该</text>
<text x="1312.0" y="486.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="500" fill="#475569" text-anchor="middle">能力</text>
