<text x="88.0" y="236.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="308.0" y="236.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">远程入口</text>
