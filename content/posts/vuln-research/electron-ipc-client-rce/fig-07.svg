<rect x="470.0" y="280.0" width="94.2" height="8.0" rx="4" fill="#94a3b8" stroke="#94a3b8" stroke-width="0"/>
<text x="546.0" y="380.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" font-weight="500" fill="#475569" text-anchor="middle">在某 AI 桌面客户端内置浏览器中访</text>
<text x="546.0" y="402.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" font-weight="500" fill="#475569" text-anchor="middle">问链接</text>
<rect x="430.0" y="520.0" width="232.0" height="56.0" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="546.0" y="554.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="700" fill="#d97706" text-anchor="middle">漏洞触发环境</text>
<rect x="720.0" y="155.0" width="390.0" height="470.0" rx="18" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
<text x="915.0" y="190.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="700" fill="#ef4444" text-anchor="middle">A. 内置浏览器（存在风险）</text>
<text x="770.0" y="250.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="500" fill="#0f172a" text-anchor="start">网页可进入客户端环境</text>
<text x="770.0" y="320.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="500" fill="#0f172a" text-anchor="start">可能接触暴露的 IPC 能力</text>
<text x="770.0" y="390.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="500" fill="#0f172a" text-anchor="start">可继续触发后续攻击链</text>
<text x="770.0" y="460.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="500" fill="#0f172a" text-anchor="start">可触发 / 攻击链可继续</text>
<rect x="1170.0" y="155.0" width="390.0" height="470.0" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="1365.0" y="190.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="700" fill="#059669" text-anchor="middle">B. 普通浏览器</text>
<text x="1365.0" y="214.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" fill="#475569" text-anchor="middle">Chrome / Edge</text>
<text x="1190.0" y="270.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="500" fill="#0f172a" text-anchor="start">网页受浏览器沙箱隔离</text>
<text x="1190.0" y="340.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="500" fill="#0f172a" text-anchor="start">无法访问客户端主进程 IPC</text>
<text x="1190.0" y="410.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="500" fill="#0f172a" text-anchor="start">无法直接调用本地更新 / 安装</text>
<text x="1190.0" y="480.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="500" fill="#0f172a" text-anchor="start">无法成立 / 攻击链无法成立</text>
<text x="1145.0" y="390.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="700" fill="#0e7490" text-anchor="middle">VS</text>
<rect x="48.0" y="700.0" width="1504.0" height="52.0" rx="16" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="800.0" y="733.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" font-weight="500" fill="#0f172a" text-anchor="middle">关键结论：同一页面在普通浏览器中只是普通网页；在内置浏览器中，边界设计不当则可能进入触发环境。</text>
</svg>
