<rect x="8" y="8" width="1584" height="884" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="800.0" y="64.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="34" font-weight="700" fill="#0f172a" text-anchor="middle">第一阶段：诱导用户在内置浏览器中打开页面</text>
<text x="800.0" y="100.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="500" fill="#0e7490" text-anchor="middle">同一恶意网页，在内置浏览器与普通浏览器中的边界完全不同</text>
<line x1="520.0" y1="118.0" x2="1080.0" y2="118.0" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
<rect x="36.0" y="155.0" width="300.0" height="470.0" rx="18" fill="#ffffff" stroke="#0e7490" stroke-width="2"/>
<text x="186.0" y="195.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">攻击者构造恶意链接</text>
