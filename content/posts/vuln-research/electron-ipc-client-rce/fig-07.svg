<polygon points="248,322 260,300 272,322" fill="#ef4444"/>
<text x="260.0" y="318.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
<text x="186.0" y="370.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" font-weight="500" fill="#475569" text-anchor="middle">伪装为文档 / 活动页面 / 资源领取</text>
<text x="186.0" y="392.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" font-weight="500" fill="#475569" text-anchor="middle">链接</text>
<rect x="60.0" y="500.0" width="252.0" height="80.0" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="186.0" y="532.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" font-weight="700" fill="#ef4444" text-anchor="middle">伪装链接（示意）</text>
<text x="186.0" y="556.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" fill="#ef4444" text-anchor="middle">恶意链接（诱导点击）</text>
<line x1="340.0" y1="360.0" x2="378.0" y2="360.0" stroke="#0e7490" stroke-width="3" stroke-linecap="round"/>
<polygon points="390.0,360.0 376.0,353.0 376.0,367.0" fill="#0e7490"/>
<rect x="396.0" y="155.0" width="300.0" height="470.0" rx="18" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
<text x="546.0" y="195.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">用户点击并打开页面</text>
<rect x="456.0" y="230.0" width="180.0" height="110.0" rx="10" fill="#e0f2fe" stroke="#0e7490" stroke-width="2"/>
<circle cx="474" cy="246" r="5" fill="#ef4444"/>
<circle cx="490" cy="246" r="5" fill="#f59e0b"/>
<circle cx="506" cy="246" r="5" fill="#22c55e"/>
